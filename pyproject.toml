[project]
name = "anki-connect-api"
version = "1.0.0"
description = "A consistent Anki Desktop API with legacy Anki-Connect forwarders"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
test = ["anki==26.9.4", "aqt==26.9.4", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests_api"]

# Used by tools/test.sh --coverage.
[tool.coverage.run]
source = ["plugin"]
branch = true
# GUI scenarios run in subprocesses and end with os._exit to skip native teardown.
patch = ["subprocess", "_exit"]
# The GUI scenario launcher only starts measured subprocesses.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
precision = 1
skip_covered = true
